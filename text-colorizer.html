<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calming Corner • Letter-by-Letter Title Colorizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&family=Short+Stack&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Quicksand', system-ui, sans-serif;
      background-color: #FAF6F0;
      color: #2F3E46;
      padding: 30px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 960px;
      width: 100%;
      background: #FFFFFF;
      border: 2px solid #E3DACF;
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 12px 36px rgba(50, 70, 60, 0.08);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    h1 {
      font-family: 'Fredoka', sans-serif;
      color: #2F4338;
      font-size: 2rem;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #657E72;
      font-size: 0.95rem;
      margin-top: -16px;
    }
    .preview-box {
      border: 3px solid #E5DFD5;
      border-radius: 20px;
      padding: 36px 24px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justifyContent: center;
      text-align: center;
      background-color: #FAF6F0;
      word-break: break-word;
      transition: all 0.2s ease;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      background: #FAF8F5;
      padding: 20px;
      border-radius: 18px;
      border: 1px solid #E7E0D6;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #3D5247;
      margin-bottom: 6px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid #D5CEC2;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      background: #FFFFFF;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #344E41;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 18px;
      border-radius: 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    button:active { transform: scale(0.96); }
    .btn-primary { background: #344E41; color: #FFFFFF; }
    .btn-secondary { background: #85CBA8; color: #1B4E36; }
    .btn-outline { background: #FFFFFF; border: 1.5px solid #D5CEC2; color: #344E41; }
    .swatch-group { display: flex; gap: 4px; margin-top: 4px; }
    .swatch { width: 16px; height: 16px; border-radius: 50%; }
  </style>
</head>
<body>

  <div class="container">
    <div>
      <h1>Calming Corner Title Colorizer</h1>
      <p class="subtitle">Cycles each letter in order through the project's color palette</p>
    </div>

    <!-- Live Preview -->
    <div class="preview-box" id="previewBox">
      <div id="coloredOutput"></div>
    </div>

    <!-- Text Input -->
    <div>
      <label for="textInput">Text / Title:</label>
      <input type="text" id="textInput" value="HAPPY" placeholder="Type your word here..." />
      <div class="btn-row" style="margin-top: 8px;">
        <button class="btn-outline" style="padding: 4px 10px; font-size: 0.78rem;" onclick="setPreset('HAPPY')">HAPPY</button>
        <button class="btn-outline" style="padding: 4px 10px; font-size: 0.78rem;" onclick="setPreset('BREATHE WITH ME')">BREATHE WITH ME</button>
        <button class="btn-outline" style="padding: 4px 10px; font-size: 0.78rem;" onclick="setPreset('MY CALM DOWN TOOLBOX')">MY CALM DOWN TOOLBOX</button>
        <button class="btn-outline" style="padding: 4px 10px; font-size: 0.78rem;" onclick="setPreset('FIND YOUR GROUND')">FIND YOUR GROUND</button>
        <button class="btn-outline" style="padding: 4px 10px; font-size: 0.78rem;" onclick="setPreset('WHAT DO I NEED RIGHT NOW?')">WHAT DO I NEED?</button>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-grid">
      <!-- Palette Selection -->
      <div>
        <label for="paletteSelect">Color Sequence:</label>
        <select id="paletteSelect" onchange="render()">
          <option value="emotions">8 Emotions (#F9D859, #6AAFE6, #B68FD0, #62B6B7...)</option>
          <option value="posters">Poster Palette (Coral, Butter, Sage, Sky, Lilac, Rose)</option>
          <option value="duo">Brand Duo (Hug Purple & Talk Green)</option>
        </select>
      </div>

      <!-- Font Selection -->
      <div>
        <label for="fontSelect">Font Family:</label>
        <select id="fontSelect" onchange="render()">
          <option value="'Fredoka', sans-serif">Fredoka (Poster Titles)</option>
          <option value="'Quicksand', sans-serif">Quicksand (Rounded Body)</option>
          <option value="'Patrick Hand', cursive">Patrick Hand (Handwritten)</option>
          <option value="'Short Stack', cursive">Short Stack (Casual)</option>
        </select>
      </div>

      <!-- Size Slider -->
      <div>
        <label id="sizeLabel">Font Size: 64px</label>
        <input type="range" id="sizeRange" min="28" max="100" value="64" oninput="render()" />
      </div>

      <!-- Letter Spacing -->
      <div>
        <label id="spaceLabel">Letter Spacing: 4px</label>
        <input type="range" id="spaceRange" min="0" max="20" value="4" oninput="render()" />
      </div>
    </div>

    <!-- Export Buttons -->
    <div class="btn-row" style="justify-content: space-between; border-top: 2px solid #F0EAE1; padding-top: 16px;">
      <div class="btn-row">
        <button class="btn-primary" onclick="downloadSvg()">Download Scalable Vector (SVG)</button>
        <button class="btn-secondary" onclick="downloadPng()">Download 300 DPI (PNG)</button>
      </div>
      <div class="btn-row">
        <button class="btn-outline" onclick="copyHtml()">Copy HTML</button>
        <button class="btn-outline" onclick="copyHexList()">Copy Color Sequence</button>
      </div>
    </div>
  </div>

  <script>
    const PALETTES = {
      emotions: ['#F9D859', '#6AAFE6', '#B68FD0', '#62B6B7', '#E89AA7', '#E86663', '#84B896', '#F49B55'],
      posters: ['#F1A990', '#EDD287', '#9BB7A5', '#8AB7D8', '#BCAADB', '#E6A5AF'],
      duo: ['#B8A2D8', '#85CBA8']
    };

    function setPreset(txt) {
      document.getElementById('textInput').value = txt;
      render();
    }

    function render() {
      const text = document.getElementById('textInput').value.toUpperCase();
      const paletteKey = document.getElementById('paletteSelect').value;
      const colors = PALETTES[paletteKey];
      const font = document.getElementById('fontSelect').value;
      const size = document.getElementById('sizeRange').value;
      const space = document.getElementById('spaceRange').value;

      document.getElementById('sizeLabel').innerText = `Font Size: ${size}px`;
      document.getElementById('spaceLabel').innerText = `Letter Spacing: ${space}px`;

      const output = document.getElementById('coloredOutput');
      output.style.fontFamily = font;
      output.style.fontSize = size + 'px';
      output.style.letterSpacing = space + 'px';
      output.style.fontWeight = '700';

      let html = '';
      let colorIdx = 0;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === ' ') {
          html += ' ';
        } else {
          const col = colors[colorIdx % colors.length];
          html += `<span style="color: ${col};">${char}</span>`;
          colorIdx++;
        }
      }
      output.innerHTML = html;
    }

    function downloadSvg() {
      const text = document.getElementById('textInput').value.toUpperCase();
      const paletteKey = document.getElementById('paletteSelect').value;
      const colors = PALETTES[paletteKey];
      const size = Number(document.getElementById('sizeRange').value);
      const space = Number(document.getElementById('spaceRange').value);
      const font = document.getElementById('fontSelect').value.split(',')[0].replace(/['"]/g, '');

      let curX = 50;
      let colorIdx = 0;
      let textElements = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === ' ') {
          curX += size * 0.45;
        } else {
          const col = colors[colorIdx % colors.length];
          textElements += `<text x="${curX}" y="${size * 1.3}" fill="${col}" font-family="${font}, sans-serif" font-size="${size}" font-weight="700">${char}</text>\n  `;
          curX += size * 0.65 + space;
          colorIdx++;
        }
      }

      const totalW = curX + 50;
      const totalH = size * 2.2;
      const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}">
  <rect width="100%" height="100%" fill="#FAF6F0"/>
  ${textElements}
</svg>`;

      const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${text.slice(0, 12).toLowerCase()}_colored.svg`;
      link.click();
    }

    function downloadPng() {
      const text = document.getElementById('textInput').value.toUpperCase();
      const paletteKey = document.getElementById('paletteSelect').value;
      const colors = PALETTES[paletteKey];
      const size = Number(document.getElementById('sizeRange').value);
      const space = Number(document.getElementById('spaceRange').value);
      const font = document.getElementById('fontSelect').value.split(',')[0].replace(/['"]/g, '');

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const scale = 2;

      ctx.font = `700 ${size}px ${font}, sans-serif`;
      let totalW = 100;
      for (let i = 0; i < text.length; i++) {
        if (text[i] === ' ') totalW += size * 0.45;
        else totalW += ctx.measureText(text[i]).width + space;
      }
      const totalH = size * 2.2;

      canvas.width = totalW * scale;
      canvas.height = totalH * scale;
      ctx.scale(scale, scale);

      ctx.fillStyle = '#FAF6F0';
      ctx.fillRect(0, 0, totalW, totalH);

      ctx.font = `700 ${size}px ${font}, sans-serif`;
      ctx.textBaseline = 'middle';

      let curX = 50;
      let colorIdx = 0;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === ' ') {
          curX += size * 0.45;
        } else {
          ctx.fillStyle = colors[colorIdx % colors.length];
          ctx.fillText(char, curX, totalH / 2);
          curX += ctx.measureText(char).width + space;
          colorIdx++;
        }
      }

      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = `${text.slice(0, 12).toLowerCase()}_colored.png`;
      link.click();
    }

    function copyHtml() {
      const output = document.getElementById('coloredOutput').innerHTML;
      navigator.clipboard.writeText(output);
      alert('Copied colored HTML markup to clipboard!');
    }

    function copyHexList() {
      const paletteKey = document.getElementById('paletteSelect').value;
      navigator.clipboard.writeText(PALETTES[paletteKey].join(' '));
      alert('Copied hex color sequence to clipboard!');
    }

    document.getElementById('textInput').addEventListener('input', render);
    render();
  </script>
</body>
</html>
