<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Calming Corner Print-Ready Vector Logo -->
  <defs>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" floodColor="#3A2C49" floodOpacity="0.1" />
    </filter>
  </defs>

  <!-- Outer Sticker / Badge Circle -->
  <circle cx="250" cy="250" r="236" fill="#FAF6F0" stroke="#E3DACF" stroke-width="7" />
  <circle cx="250" cy="250" r="222" fill="#FFFFFF" stroke="#85CCA8" stroke-width="3" stroke-dasharray="9 7" />

  <!-- THE HUGGING CC CHARACTERS -->
  <g id="hugging-cc" transform="translate(0, -32)">
    
    <!-- FIRST 'C' (Purple: "Calming" / The Hugger) -->
    <g id="purple-c">
      <!-- Main Body of Purple C -->
      <path
        d="M 230,120 C 145,120 90,165 90,230 C 90,295 145,340 230,340 C 248,340 264,336 276,328 C 284,320 280,304 268,300 C 256,296 244,300 228,300 C 165,300 130,268 130,230 C 130,192 165,160 228,160 C 244,160 256,164 268,160 C 280,156 284,140 276,132 C 264,124 248,120 230,120 Z"
        fill="#B8A2D8"
        stroke="#593E7C"
        stroke-width="7"
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- Purple C's Cute Peaceful Eyes (Print-friendly bold strokes) -->
      <path d="M 120,210 Q 134,196 148,210" fill="none" stroke="#452D64" stroke-width="6.5" stroke-linecap="round" />
      <path d="M 170,210 Q 184,196 198,210" fill="none" stroke="#452D64" stroke-width="6.5" stroke-linecap="round" />

      <!-- Purple C's Smile -->
      <path d="M 152,238 Q 164,250 176,238" fill="none" stroke="#452D64" stroke-width="5.5" stroke-linecap="round" />

      <!-- Rosy Cheeks -->
      <circle cx="122" cy="226" r="11" fill="#F4AEC0" opacity="0.85" />
      <circle cx="196" cy="226" r="11" fill="#F4AEC0" opacity="0.85" />

      <!-- Purple C's Arm Lovingly Hugging the Green C -->
      <path
        d="M 200,162 C 235,152 278,168 294,204 C 302,222 298,242 278,246 C 262,250 250,234 246,218 C 242,202 220,188 200,188 Z"
        fill="#C9B6E4"
        stroke="#593E7C"
        stroke-width="6.5"
        stroke-linejoin="round"
      />
      <!-- Little Hug Paw -->
      <circle cx="288" cy="225" r="14" fill="#C9B6E4" stroke="#593E7C" stroke-width="5.5" />
    </g>

    <!-- SECOND 'C' (Green: "Corner" / Child) -->
    <g id="green-c">
      <!-- Main Body of Green C (Nestled into the hug) -->
      <path
        d="M 390,145 C 320,145 275,182 275,238 C 275,294 320,332 390,332 C 405,332 418,328 428,320 C 435,312 431,298 420,294 C 408,290 398,294 386,294 C 335,294 310,268 310,238 C 310,208 335,183 386,183 C 398,183 408,187 420,183 C 431,179 435,165 428,157 C 418,149 405,145 390,145 Z"
        fill="#85CBA8"
        stroke="#235A42"
        stroke-width="7"
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- Green C's Content Smiling Eyes -->
      <path d="M 306,224 Q 318,212 330,224" fill="none" stroke="#163F2E" stroke-width="6.5" stroke-linecap="round" />
      <path d="M 350,224 Q 362,212 374,224" fill="none" stroke="#163F2E" stroke-width="6.5" stroke-linecap="round" />

      <!-- Green C's Smile -->
      <path d="M 334,248 Q 344,258 354,248" fill="none" stroke="#163F2E" stroke-width="5.5" stroke-linecap="round" />

      <!-- Peach Blush -->
      <circle cx="308" cy="238" r="10" fill="#F7BAA6" opacity="0.9" />
      <circle cx="372" cy="238" r="10" fill="#F7BAA6" opacity="0.9" />

      <!-- Green C's Little Resting Hand -->
      <circle cx="340" cy="272" r="12" fill="#A2DCBF" stroke="#235A42" stroke-width="5.5" />
    </g>

    <!-- Little Floating Heart between their heads -->
    <path
      d="M 250,92 C 242,75 218,80 218,100 C 218,122 250,142 250,142 C 250,142 282,122 282,100 C 282,80 258,75 250,92 Z"
      fill="#E68278"
      stroke="#593E7C"
      stroke-width="4.5"
    />
  </g>

  <!-- PRINT TYPOGRAPHY (Properly Kerned with tspan to prevent collisions) -->
  <g id="brand-text" text-anchor="middle" font-family="'Fredoka', 'Quicksand', 'Nunito', 'Segoe UI', system-ui, sans-serif">
    <text x="250" y="398" font-size="34" font-weight="800">
      <tspan fill="#593E7C">CALMING </tspan>
      <tspan fill="#235A42">CORNER</tspan>
    </text>
    
    <text x="250" y="425" font-size="14.5" font-weight="700" fill="#6A8074" letter-spacing="2">
      A SAFE SPACE FOR BIG FEELINGS
    </text>
  </g>
</svg>
